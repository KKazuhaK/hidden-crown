name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-postgres-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash -n install.sh
      - run: npm run typecheck && npm test
      - name: SQLite complete runtime checks
        run: npm run test:selfhost
        env:
          TEST_DATABASE_URL: ''
      - name: PostgreSQL complete runtime checks
        run: npm run test:selfhost
      - name: SQLite computer runtime
        run: npm run test:computer
        env:
          TEST_DATABASE_URL: ''
      - name: PostgreSQL computer runtime
        run: npm run test:computer
      - name: SQLite undo-disabled runtime
        run: npm run test:undo
        env:
          TEST_DATABASE_URL: ''
      - name: PostgreSQL undo-disabled runtime
        run: npm run test:undo
      - name: SQLite interrogation runtime
        run: npm run test:interrogation
        env:
          TEST_DATABASE_URL: ''
      - name: PostgreSQL interrogation runtime
        run: npm run test:interrogation
      - name: SQLite standard chess runtime
        run: npm run test:standard
        env:
          TEST_DATABASE_URL: ''
      - name: PostgreSQL standard chess runtime
        run: npm run test:standard
      - name: Container runtime and persistent volume
        shell: bash
        run: |
          set -euo pipefail
          docker build -t hidden-crown:test .
          secret="$RUNNER_TEMP/hc-admin-password.txt"
          printf '%s' 'isolated-container-test-password' > "$secret"
          sudo chown 1000:1000 "$secret"
          sudo chmod 600 "$secret"
          gateway=$(docker network inspect bridge --format "{{range .IPAM.Config}}{{.Gateway}}{{end}}")
          docker run -d --name hc-test --read-only --tmpfs /tmp --cap-drop ALL --memory=384m --cpus=1 --pids-limit=64 \
            --security-opt no-new-privileges -p 127.0.0.1:8794:8787 \
            -e PUBLIC_ORIGIN=http://127.0.0.1:8794 -e ADMIN_USERNAME=admin \
            -e CREATE_LIMIT_PER_IP=200 -e CREATE_LIMIT_GLOBAL=500 -e "TRUSTED_PROXIES=$gateway" \
            -e ADMIN_PASSWORD_FILE=/run/secrets/admin_password \
            --mount "type=bind,src=$secret,dst=/run/secrets/admin_password,readonly" \
            -v hc-test-data:/app/data hidden-crown:test
          trap 'docker logs hc-test; docker rm -f hc-test; docker volume rm hc-test-data' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8794/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8794/healthz
          export HIDDEN_CROWN_URL=http://127.0.0.1:8794
          export HIDDEN_CROWN_ADMIN_PASSWORD=isolated-container-test-password
          node scripts/room-smoke.mjs
          node scripts/join-smoke.mjs
          node scripts/computer-smoke.mjs
          node scripts/undo-smoke.mjs
          node scripts/persistence-smoke.mjs prepare
          docker restart hc-test
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8794/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8794/healthz
          node scripts/persistence-smoke.mjs verify
          node scripts/interrogation-smoke.mjs
          docker restart hc-test
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8794/healthz; then break; fi
            sleep 1
          done
          node scripts/capacity-smoke.mjs
          node scripts/computer-capacity.mjs
      - name: Nginx configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hc-cert"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=chess.example.com' \
            -keyout "$RUNNER_TEMP/hc-cert/privkey.pem" -out "$RUNNER_TEMP/hc-cert/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/hidden-crown-proxy.conf:/etc/nginx/snippets/hidden-crown-proxy.conf:ro" \
            -v "$RUNNER_TEMP/hc-cert:/etc/letsencrypt/live/chess.example.com:ro" \
            nginx:stable-alpine nginx -t
      - name: Compose deployment from environment configuration
        shell: bash
        env:
          HIDDEN_CROWN_IMAGE: hidden-crown:test
          PUBLIC_ORIGIN: http://127.0.0.1:8796
          HOST_PORT: '8796'
          ADMIN_USERNAME: compose-admin
          ADMIN_PASSWORD: isolated-compose-test-password
        run: |
          set -euo pipefail
          docker compose -p hc-compose config --quiet
          docker compose -p hc-compose up -d --pull never
          trap 'docker compose -p hc-compose logs; docker compose -p hc-compose down -v' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8796/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8796/healthz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('http://127.0.0.1:8796/api/admin/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: process.env.ADMIN_USERNAME, password: process.env.ADMIN_PASSWORD })
          });
          assert.equal(response.status, 200);
          assert.ok((await response.json()).csrf);
          console.log('Compose environment-based administrator login passed');
          JS
      - name: Compose with host data directory and restart persistence
        shell: bash
        env:
          HIDDEN_CROWN_IMAGE: hidden-crown:test
          PUBLIC_ORIGIN: http://127.0.0.1:8797
          HOST_PORT: '8797'
          ADMIN_USERNAME: bind-admin
          ADMIN_PASSWORD: isolated-bind-compose-test-password
          HIDDEN_CROWN_URL: http://127.0.0.1:8797
          HIDDEN_CROWN_ADMIN_USERNAME: bind-admin
          HIDDEN_CROWN_ADMIN_PASSWORD: isolated-bind-compose-test-password
        run: |
          set -euo pipefail
          export DATA_DIR="$RUNNER_TEMP/hc-bind/data"
          sudo install -d -m 700 -o 1000 -g 1000 "$DATA_DIR"
          compose=(docker compose -p hc-bind -f docker-compose.bind.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --pull never
          trap '"${compose[@]}" logs; "${compose[@]}" down' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8797/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8797/healthz
          node scripts/persistence-smoke.mjs prepare
          sudo test -s "$DATA_DIR/hidden-crown-v2.sqlite"
          test "$(sudo stat -c '%u:%g' "$DATA_DIR/hidden-crown-v2.sqlite")" = '1000:1000'
          "${compose[@]}" restart
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8797/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8797/healthz
          node scripts/persistence-smoke.mjs verify
      - name: Compose with existing PostgreSQL
        shell: bash
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
          HIDDEN_CROWN_IMAGE: hidden-crown:test
          PUBLIC_ORIGIN: http://127.0.0.1:8799
          HOST_PORT: '8799'
          ADMIN_USERNAME: postgres-admin
          ADMIN_PASSWORD: isolated-postgres-compose-password
          HIDDEN_CROWN_URL: http://127.0.0.1:8799
          HIDDEN_CROWN_ADMIN_USERNAME: postgres-admin
          HIDDEN_CROWN_ADMIN_PASSWORD: isolated-postgres-compose-password
          DATABASE_URL: postgresql://postgres:isolated-ci-postgres-password@host.docker.internal:5432/hc_compose
          CREATE_LIMIT_PER_IP: '100'
        run: |
          set -euo pipefail
          docker exec "$PG_SERVICE_ID" createdb -U postgres hc_compose
          compose=(docker compose -p hc-postgres -f docker-compose.postgres.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --pull never
          trap '"${compose[@]}" logs; "${compose[@]}" down' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8799/healthz
          node scripts/room-smoke.mjs
          node scripts/join-smoke.mjs
          node scripts/persistence-smoke.mjs prepare
          "${compose[@]}" restart
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8799/healthz
          node scripts/persistence-smoke.mjs verify
