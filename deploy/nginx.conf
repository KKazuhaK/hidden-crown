# Include these declarations inside nginx.conf's http {} block.
map $http_upgrade $hc_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=hc_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hc_create:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=hc_login:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=hc_connections:10m;

server {
    listen 80;
    server_name chess.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name chess.example.com;
    ssl_certificate /etc/letsencrypt/live/chess.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.example.com/privkey.pem;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn hc_connections 20;

    location = /api/rooms {
        limit_req zone=hc_create burst=5 nodelay;
        include /etc/nginx/snippets/hidden-crown-proxy.conf;
    }
    location = /api/admin/login {
        limit_req zone=hc_login burst=3 nodelay;
        include /etc/nginx/snippets/hidden-crown-proxy.conf;
    }
    location / {
        limit_req zone=hc_requests burst=30 nodelay;
        include /etc/nginx/snippets/hidden-crown-proxy.conf;
    }
}
