<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden Crown · Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header class="site-header"><a class="brand" href="/">♔︎ Hidden Crown</a><div class="header-actions"><span id="admin-label">Admin</span><button id="language" class="quiet-button" type="button">中文</button></div></header>
  <main id="admin-app"></main>
  <dialog id="admin-confirm" aria-labelledby="admin-confirm-title" aria-describedby="admin-confirm-text">
    <h2 id="admin-confirm-title">Confirm action</h2><p id="admin-confirm-text"></p>
    <div class="actions"><button id="admin-cancel" type="button">Cancel</button><button id="admin-accept" class="danger" type="button">Confirm</button></div>
  </dialog>
  <dialog id="admin-links" aria-labelledby="admin-links-title">
    <h2 id="admin-links-title">Player links</h2><p id="admin-links-help" class="small"></p>
    <div id="admin-links-content"></div>
    <div class="actions"><button id="admin-links-close" type="button">Close</button></div>
  </dialog>
  <script type="module" src="/js/admin.js"></script>
</body></html>
