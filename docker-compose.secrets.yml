# Optional: use a password file instead of passing the password to the container environment.
# Keep ADMIN_PASSWORD=using-password-file in .env to satisfy the base interpolation.
# Start with: docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
services:
  hidden-crown:
    environment:
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
secrets:
  admin_password:
    file: ./secrets/admin-password.txt
