# Standalone: connects to your existing PostgreSQL; no database container or SQLite volume.
services:
  hidden-crown:
    image: ${HIDDEN_CROWN_IMAGE:-ghcr.io/kkazuhak/hidden-crown:latest}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set an administrator password of 16 to 256 characters in .env}
      # Only the proxy addresses explicitly named here can supply the real client IP.
      DATABASE_URL: ${DATABASE_URL:?Set a PostgreSQL connection URL in .env}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/hidden-crown-v2.sqlite}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      MAX_ACTIVE_ROOMS: ${MAX_ACTIVE_ROOMS:-256}
      MAX_LOADED_ROOMS: ${MAX_LOADED_ROOMS:-256}
      MAX_CACHE_BYTES: ${MAX_CACHE_BYTES:-67108864}
      MAX_STORED_BYTES: ${MAX_STORED_BYTES:-805306368}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CREATE_LIMIT_PER_IP: ${CREATE_LIMIT_PER_IP:-5}
      CREATE_LIMIT_GLOBAL: ${CREATE_LIMIT_GLOBAL:-100}
      WAITING_TIMEOUT_MINUTES: ${WAITING_TIMEOUT_MINUTES:-15}
      MAX_ROOMS: ${MAX_ROOMS:-10000}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-512}
      MAX_ROOM_BYTES: ${MAX_ROOM_BYTES:-4194304}
      MAX_DATABASE_BYTES: ${MAX_DATABASE_BYTES:-1073741824}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
